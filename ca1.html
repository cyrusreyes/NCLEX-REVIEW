<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CA 1 Examination</title>
<style>
  body { 
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    background-color: #f4f7f6; 
    color: #333; 
    margin: 0; 
    padding: 20px; 
  }
  .container { 
    max-width: 800px; 
    margin: 0 auto; 
    background: #fff; 
    padding: 30px; 
    border-radius: 8px; 
    box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
  }
  h1, h2 { color: #2c3e50; }
  .hidden { display: none; }
  .btn { 
    padding: 10px 20px; 
    margin: 5px 0; 
    border: none; 
    border-radius: 4px; 
    cursor: pointer; 
    background-color: #3498db; 
    color: #fff; 
    font-size: 16px; 
  }
  .btn:hover { background-color: #2980b9; }
  .btn-back { background-color: #95a5a6; }
  .btn-back:hover { background-color: #7f8c8d; }
  .options label { 
    display: block; 
    padding: 12px; 
    margin: 8px 0; 
    background: #ecf0f1; 
    border-radius: 4px; 
    cursor: pointer; 
    transition: background 0.2s;
  }
  .options label:hover { background: #d0d3d4; }
  input[type="radio"] { margin-right: 10px; transform: scale(1.2); }
  .header-info {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 2px solid #eee;
    padding-bottom: 10px;
  }
  .progress-tracker { font-weight: bold; color: #7f8c8d; font-size: 18px; }
  .correct-text { color: #27ae60; font-weight: bold; margin-top: 8px; }
  .incorrect-text { color: #c0392b; font-weight: bold; margin-top: 8px; }
  .rationale-box {
    margin-top: 10px;
    padding: 12px;
    background-color: #fdfae6;
    border-left: 4px solid #f1c40f;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <!-- Home Screen -->
  <div class="container" id="home-screen">
    <h1>CA 1 Practice Examination</h1>
    <p>Test your knowledge on CA 1 topics. Questions and options will be randomized upon starting.</p>
    
    <div style="margin: 25px 0; padding: 15px; background: #e8f4f8; border-radius: 6px;">
      <label for="item-limit-select" style="font-size: 16px;"><strong>Select Number of Items:</strong></label><br><br>
      <select id="item-limit-select" style="padding: 8px; font-size: 16px; border-radius: 4px; border: 1px solid #ccc; width: 100%; max-width: 300px;">
        <option value="10">10 Questions</option>
        <option value="20">20 Questions</option>
        <option value="50">50 Questions</option>
        <option value="100">100 Questions</option>
        <option value="all">All Available</option>
      </select>
    </div>
    
    <button class="btn" style="width: 100%; padding: 15px; font-size: 18px;" onclick="startQuiz()">Begin Examination</button>
  </div>

  <!-- Quiz Screen -->
  <div class="container hidden" id="quiz-screen">
    <div class="header-info">
      <div class="progress-tracker" id="progress-tracker">Question 1 of X</div>
    </div>
    
    <h2 id="question-text" style="font-size: 20px; line-height: 1.5;">Question goes here?</h2>
    <div class="options" id="options-container">
      <!-- Options generated dynamically -->
    </div>
    
    <div style="margin-top: 30px; display: flex; justify-content: space-between;">
      <button class="btn btn-back" id="back-btn" onclick="prevQuestion()">Back</button>
      <button class="btn" id="next-btn" onclick="nextQuestion()">Next</button>
    </div>
  </div>

  <!-- Result Screen -->
  <div class="container hidden" id="result-screen">
    <h1>Examination Results</h1>
    <h2 id="score-display" style="color: #2980b9;">Your Score: 0/0</h2>
    <button class="btn" style="width: 100%; margin-top: 20px;" onclick="restartQuiz()">Return to Start</button>
  </div>

<script>
  // --- ADD YOUR CA 1 QUESTIONS HERE ---
  const allQuestions = [
    {
      question: "Sample CA 1 Question: What is the correct protocol?",
      options: [
        "A. Do this",
        "B. Do that",
        "C. Do nothing",
        "D. Call for help"
      ],
      correctAnswer: 1, // Index of the correct option (B is 1)
      rationale: "This is the rationale explaining why B is the correct answer."
    },
    // Add more CA 1 questions following the exact same format
  ];

  // --- QUIZ STATE VARIABLES ---
  let currentQuizQuestions = [];
  let currentQuestionIndex = 0;
  let score = 0;
  let isAnswered = false;

  // --- START THE QUIZ ---
  function startQuiz() {
    const limit = document.getElementById('item-limit-select').value;
    let filtered = [...allQuestions];

    // Shuffle the questions
    filtered.sort(() => Math.random() - 0.5);

    // Apply the selected item limit
    if (limit !== 'all') {
      currentQuizQuestions = filtered.slice(0, parseInt(limit));
    } else {
      currentQuizQuestions = filtered;
    }

    if (currentQuizQuestions.length === 0) {
      alert("No questions found.");
      return;
    }

    currentQuestionIndex = 0;
    score = 0;
    document.getElementById('home-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');

    loadQuestion();
  }

  // --- LOAD A QUESTION ---
  function loadQuestion() {
    isAnswered = false; 
    const q = currentQuizQuestions[currentQuestionIndex];
    
    document.getElementById('progress-tracker').innerText = `Question ${currentQuestionIndex + 1} of ${currentQuizQuestions.length}`;
    document.getElementById('question-text').innerText = q.question;
    
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = ''; 
    
    q.options.forEach((opt, index) => {
      const label = document.createElement('label');
      label.id = `label-${index}`;
      
      const radio = document.createElement('input');
      radio.type = 'radio';
      radio.name = 'option';
      radio.value = index;
      radio.onclick = () => checkAnswer(index); 
      
      label.appendChild(radio);
      label.appendChild(document.createTextNode(opt));
      optionsContainer.appendChild(label);
    });
    
    const rationaleBox = document.createElement('div');
    rationaleBox.id = 'rationale-container';
    rationaleBox.className = 'rationale-box hidden';
    optionsContainer.appendChild(rationaleBox);

    document.getElementById('back-btn').style.display = currentQuestionIndex === 0 ? 'none' : 'inline-block';
    document.getElementById('next-btn').innerText = currentQuestionIndex === currentQuizQuestions.length - 1 ? 'Finish Exam' : 'Next';
    document.getElementById('next-btn').style.display = 'none'; 
  }

  // --- INSTANT FEEDBACK LOGIC ---
  function checkAnswer(selectedIndex) {
    if (isAnswered) return; 
    isAnswered = true;
    
    const q = currentQuizQuestions[currentQuestionIndex];
    const options = document.getElementsByName('option');
    const rationaleBox = document.getElementById('rationale-container');
    
    options.forEach(opt => opt.disabled = true);
    rationaleBox.classList.remove('hidden');
    
    if (selectedIndex === q.correctAnswer) {
      score++;
      document.getElementById(`label-${selectedIndex}`).style.backgroundColor = '#d4edda'; 
      rationaleBox.innerHTML = `<div class="correct-text">Correct!</div>${q.rationale}`;
    } else {
      document.getElementById(`label-${selectedIndex}`).style.backgroundColor = '#f8d7da'; 
      document.getElementById(`label-${q.correctAnswer}`).style.backgroundColor = '#d4edda'; 
      rationaleBox.innerHTML = `<div class="incorrect-text">Incorrect.</div>${q.rationale}`;
    }
    
    document.getElementById('next-btn').style.display = 'inline-block';
  }

  // --- NAVIGATION CONTROLS ---
  function nextQuestion() {
    if (currentQuestionIndex < currentQuizQuestions.length - 1) {
      currentQuestionIndex++;
      loadQuestion();
    } else {
      showResults();
    }
  }

  function prevQuestion() {
    if (currentQuestionIndex > 0) {
      currentQuestionIndex--;
      loadQuestion();
    }
  }

  // --- RESULTS AND RESTART ---
  function showResults() {
    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    document.getElementById('score-display').innerText = `Your Score: ${score}/${currentQuizQuestions.length}`;
  }

  function restartQuiz() {
    document.getElementById('result-screen').classList.add('hidden');
    document.getElementById('home-screen').classList.remove('hidden');
  }
</script>
</body>
</html>
